[project]
name = "debug"
version = "0.1.0"
description = "debug"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "asyncio>=4.0.0",
    "matplotlib>=3.11.2",
    "maturin>=1.16.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
debug = "debug:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
